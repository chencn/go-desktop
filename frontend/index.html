<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-desktop</title>
    <!--
      启动底板：Vue 挂载前 WebView 只能渲染这段内联样式，因此这里复刻 Apple HIG 的底色与字体栈，
      避免首帧闪白/闪黑。主题档位由 app/display.ts 在挂载后写入 html.dark，二者互不依赖。
    -->
    <style>
      :root {
        color-scheme: light;
        --boot-background: #f5f5f7;
        --boot-foreground: #1d1d1f;
        --boot-muted-foreground: #86868b;
        --boot-primary: #0071e3;
        --boot-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        margin: 0;
        min-width: 0;
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
        background: var(--boot-background);
      }

      html,
      body {
        overflow: hidden;
      }

      body {
        color: var(--boot-foreground);
        font-family: var(--boot-font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        user-select: none;
      }

      /* #app 被 Vue 接管的瞬间，独立满屏底板保证 WebView 最外层不会露出默认黑底。 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        display: block;
        background: var(--boot-background);
        pointer-events: none;
      }

      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--boot-background);
      }

      .boot-spinner {
        width: 26px;
        height: 26px;
        border: 2.5px solid rgba(0, 113, 227, 0.18);
        border-top-color: var(--boot-primary);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-loading-text {
        color: var(--boot-muted-foreground);
        font-size: 13px;
        letter-spacing: -0.01em;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span class="boot-loading-text">正在加载</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
