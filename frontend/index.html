<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>go-desktop</title>
    <!--
      启动底板：Vue 挂载前 WebView 只能渲染这段内联样式，因此这里复刻 Apple HIG 的底色与字体栈，
      避免首帧闪白/闪黑。主题档位由 app/display.ts 在挂载后写入 html.dark，二者互不依赖。
    -->
    <style>
      :root {
        color-scheme: light;
        --boot-background: #f5f5f7;
        --boot-foreground: #1d1d1f;
        --boot-muted-foreground: #86868b;
        --boot-primary: #0071e3;
        --boot-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        margin: 0;
        min-width: 0;
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
        background: var(--boot-background);
      }

      html,
      body {
        overflow: hidden;
      }

      body {
        color: var(--boot-foreground);
        font-family: var(--boot-font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        user-select: none;
      }

      /* #app 被 Vue 接管的瞬间，独立满屏底板保证 WebView 最外层不会露出默认黑底。 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        display: block;
        background: var(--boot-background);
        pointer-events: none;
      }

      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--boot-background);
      }

      .boot-spinner {
        width: 26px;
        height: 26px;
        border: 2.5px solid rgba(0, 113, 227, 0.18);
        border-top-color: var(--boot-primary);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-loading-text {
        color: var(--boot-muted-foreground);
        font-size: 13px;
        letter-spacing: -0.01em;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span class="boot-loading-text">正在加载</span>
      </div>
    </div>
    <!--
      Apple iOS 26 / macOS 26 Liquid Glass 物理折射滤镜
      结合 feDisplacementMap 与渐变贴图，为 .lg-surface 边缘产生物理光线折射
    -->
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden;pointer-events:none;" aria-hidden="true">
      <defs>
        <filter id="liquid-glass" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
          <feImage
            result="dispMap"
            x="0" y="0" width="100%" height="100%"
            preserveAspectRatio="none"
            href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'400'%20height%3D'300'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'gx'%20x1%3D'0%25'%20y1%3D'0%25'%20x2%3D'100%25'%20y2%3D'0%25'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%23000'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23f00'%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D'gy'%20x1%3D'0%25'%20y1%3D'0%25'%20x2%3D'0%25'%20y2%3D'100%25'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%23000'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%230f0'%2F%3E%3C%2FlinearGradient%3E%3Cfilter%20id%3D'b'%3E%3CfeGaussianBlur%20stdDeviation%3D'14'%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D'400'%20height%3D'300'%20rx%3D'24'%20fill%3D'url(%23gx)'%20style%3D'mix-blend-mode%3Ascreen'%2F%3E%3Crect%20width%3D'400'%20height%3D'300'%20rx%3D'24'%20fill%3D'url(%23gy)'%20style%3D'mix-blend-mode%3Ascreen'%2F%3E%3Crect%20width%3D'400'%20height%3D'300'%20rx%3D'24'%20fill%3D'%23808080'%20filter%3D'url(%23b)'%2F%3E%3C%2Fsvg%3E"
          />
          <feDisplacementMap
            in="SourceGraphic" in2="dispMap"
            scale="-32"
            xChannelSelector="R" yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
